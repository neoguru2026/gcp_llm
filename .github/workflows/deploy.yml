name: Deploy NeoGuru LLM Service

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: airy-harbor-483517-s2
  REGION: europe-north2
  REPOSITORY: neoguru
  IMAGE_NAME: llm-single-model
  TF_WORKING_DIR: infra   # folder where your Terraform lives

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Authenticate to Google Cloud
      # -----------------------------
      - name: Set up Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -----------------------------
      # Configure Docker for Artifact Registry
      # -----------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # -----------------------------
      # Build and push Docker image
      # -----------------------------
      - name: Build Docker image
        run: |
          docker build --build-arg HF_TOKEN=${{ secrets.HF_TOKEN }} -t $IMAGE_NAME:latest .

      - name: Tag Docker image
        run: |
          docker tag $IMAGE_NAME:latest \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

      # -----------------------------
      # Terraform deploy
      # -----------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve